# Configure the lint rules for the release artifact being analyzed.

[rules.build-artifact-extension]
enabled = true
severity = "error" # Report matching files as errors.
extensions = [
    ".ilk",
    ".obj",
    ".iobj",
    ".ipdb",
    ".tlog",
    ".lastbuildstate",
    ".dSYM",
    ".exp",
    ".lib",
    ".pdb",
]

[rules.unsigned-binary]
enabled = true
severity = "warning" # Report unsigned executables and libraries as warnings.

[rules.untrusted-binary-signature]
enabled = true
severity = "warning" # Report binary signatures whose signer is not trusted.

[rules.invalid-binary-signature]
enabled = true
severity = "error" # Report cryptographically invalid binary signatures.

[rules.invalid-app-bundle]
enabled = true
severity = "error" # Report malformed macOS application bundles.

[rules.unsigned-app-bundle]
enabled = true
severity = "warning" # Report unsigned macOS application bundles.

[rules.untrusted-app-bundle-signature]
enabled = true
severity = "warning" # Report application signatures without Apple trust.

[rules.invalid-app-bundle-signature]
enabled = true
severity = "error" # Report invalid bundle signatures and resource seals.

[rules.debug-entitlement]
enabled = true
severity = "error" # Report release binaries that allow debugger attachment.

[rules.unsigned-artifact]
enabled = true
severity = "warning" # Report missing release artifact signatures.

[rules.untrusted-artifact-signature]
enabled = true
severity = "warning" # Report signatures whose signer is not trusted.

[rules.invalid-artifact-signature]
enabled = true
severity = "error" # Report cryptographically invalid release artifact signatures.

[rules.inconsistent-installation-scope]
enabled = true
severity = "warning" # Report conflicting installation scope signals.

[rules.missing-license-agreement]
enabled = true
severity = "error" # Report artifacts that omit an embedded license agreement.
