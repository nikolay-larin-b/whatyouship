# Configure the lint rules for the release artifact being analyzed.

[rules.build-artifact-extension]
enabled = true
severity = "error" # Report matching files as errors.
extensions = [
    ".ilk",
    ".obj",
    ".iobj",
    ".ipdb",
    ".tlog",
    ".lastbuildstate",
    ".exp",
    ".lib",
    ".pdb",
]

[rules.unsigned-binary]
enabled = true
severity = "warning" # Report unsigned executables and libraries as warnings.
