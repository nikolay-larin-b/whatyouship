[build-system]
requires = ["flit_core>=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "WhatYouShip"
dynamic = ["version"]
description = "Know what you ship. Know what you install."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Nikolay Larin", email = "nikolay.larin@gmail.com"}]
license = "MIT"
dependencies = [
    "pymsi==0.0.0rc1",
    "lief>=1.0,<2",
    "platformdirs",
]

[project.scripts]
whatyouship = "whatyouship.cli:main"

[tool.flit.module]
name = "whatyouship"
