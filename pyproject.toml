[build-system]
requires = ["flit_core>=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "whatyouship"
dynamic = ["version"]
description = "Know what you ship. Know what you install."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

authors = [
    { name = "Nikolay Larin", email = "nikolay.larin@gmail.com" },
]

keywords = [
    "release",
    "artifacts",
    "installer",
    "linting",
    "binary-analysis",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Software Distribution",
]

dependencies = [
    "pymsi==0.0.0rc1",
    "lief>=1.0,<2",
]

[project.urls]
Repository = "https://github.com/nikolay-larin-b/whatyouship"
Issues = "https://github.com/nikolay-larin-b/whatyouship/issues"

[project.scripts]
whatyouship = "whatyouship.cli:main"

[tool.flit.module]
name = "whatyouship"
